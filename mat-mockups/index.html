function schoolAnswer(s){const gap=s.forecast-s.budget,position=gap>0?k(gap)+' over budget':gap<0?k(-gap)+' under budget':'on budget';const followup=s.id===2?'Four fixed-term posts could reduce this year’s cost by £38k. Confirm the workforce plan and start date.':s.id===1?'Low spend can hide unmet demand: review the eight unfilled requests before reducing the school budget.':'Review the school’s role mix, cover reasons and unfilled requests before changing the staffing plan.';return `<h3>${s.name} is ${position}</h3><p>${k(s.forecast)} forecast against ${k(s.budget)} budget; ${money(s.forecast*1000/s.pupils)} per pupil. The fictional ${s.phase.toLowerCase()} peer median is ${money(phasePeerMedian[s.phase])}.</p><p>${s.filled} of ${s.requests} requests were filled (${(s.filled/s.requests*100).toFixed(1)}%); ${s.requests-s.filled} were unfilled. Last year’s spend was ${k(s.prior)}.</p><p>${followup}</p>${btn('Open school','data-school="'+s.id+'"','small')}${s.id===1?btn('Show risk evidence','data-detail="risk"','small'):s.id===2?btn('Show action working','data-detail="actions"','small'):btn('Compare peers','data-go="benchmarks"','small')}`;}

function showBoard(){modal('Monthly board pack · preview',`<div class="board-sheet"><span class="stamp">Northlight Learning Trust · October 2026 · example figures</span><h2>Supply budget: £107k above plan</h2><ul><li>£4.147m forecast against £4.040m budget; +£447k on last year.</li><li>Four schools forecast over budget. Three account for £273k of adverse variance.</li><li>Vacancies and SEND drive £547k of growth, partly offset by other cover reductions.</li><li>£114k in-year actions could bring the position to £7k under budget.</li><li>Hollins Park needs a service review despite its apparent underspend.</li></ul>${waterfall()}${state.boardActions?'<h3>Actions added for board review</h3>'+actionList():''}</div>`,btn('Include action plan','data-board-actions')+btn('Print / save PDF','data-print-board','primary'));}
const prompts={overview:['Why is Willow over budget?','Show the savings working','Draft the board finance note'],forecast:['What changed this month?','Model the proposed actions','Explain the forecast range'],schools:['Compare spending per pupil','Why is Hollins Park a risk?','Which schools need action?'],workforce:['What is driving structural demand?','Review 12 / 18-week milestones','Compare long-term cover'],benchmarks:['How comparable are these peers?','Compare spending per pupil','Explain the source periods'],service:['Where is cover unfilled?','Review Apex service','Compare fill by notice'],reports:['Draft the board finance note','Show the savings working','What can a school user see?'],operations:['Which exceptions need attention?','Review 12 / 18-week milestones','Show potential overcharges'],settings:['What can a school user see?','Explain recommendation policy','What data is still needed?']};
function answer(q){const t=q.toLowerCase();const scopedSchool=schoolData.find(s=>t.includes(s.name.replace(/ Academy| Learning Centre| Primary| Infants/g,'').toLowerCase()));if(scopedSchool)return schoolAnswer(scopedSchool);if(/willow/.test(t))return `<h3>Willow is £144k over budget</h3><p>£664k forecast against £520k budget, or 27.7% over. Ongoing SEND support and rolling TA cover are the main example drivers.</p><p>Four fixed-term posts could reduce this year’s cost by £38k. The workforce plan and start date need review.</p>${btn('Open Willow','data-school="2"','small')}${btn('Show action working','data-detail="actions"','small')}`;if(/hollins|risk/.test(t))return `<h3>Low spend can hide unmet demand</h3><p>Hollins Park is £5k under budget, but eight of 160 requests were unfilled. Review its cover position before reducing its budget.</p>${btn('Show risk evidence','data-detail="risk"','small')}`;if(/12|18|milestone|conversion/.test(t))return `<h3>Two milestones need a review</h3><p>Sam Doyle approaches 12 weeks on 9 November; Maya Patel approaches 18 weeks on 16 November. These are review prompts, not automatic conversion rights.</p>${btn('Review options','data-detail="conversion"','small')}`;if(/long.term/.test(t))return `<h3>A long-term option could save £11k</h3><p>For Brookside’s 50 remaining English cover days, the example compares £440/day with £220/day. Check availability, terms and educator agreement.</p>${btn('Compare options','data-detail="longterm"','small')}`;if(/overcharge|invoice/.test(t))return `<h3>£4,884 potential difference</h3><p>37 example Northstar days were billed at £260 against a £128 agreement. Confirm exceptions and credits before seeking recovery.</p>${btn('Show the invoice working','data-detail="overcharge"','small')}`;if(/apex|supplier|notice|unfilled|exceptions/.test(t))return `<h3>Review urgent demand and supplier reliability</h3><p>60 of 1,000 closed requests were unfilled. Same-day requests have 80% fill. Apex’s separate supplier cohort is at 92.8%, below its 95% target.</p>${btn('Open service breakdown','data-go="service"','small')}${btn('Apex review','data-detail="supplier"','small')}`;if(/board|note/.test(t))return `<h3>Board finance note · draft</h3><p>The trust forecasts £4.147m supply spend, £107k over budget. Structural vacancies and SEND support drive the increase. Four proposed actions total £114k in-year; delivery would bring the position £7k under budget.</p>${btn('Open draft board pack','data-board','small')}`;if(/saving|action|model/.test(t))return `<h3>£114k in-year, £216k annualised</h3><p>Recruitment £30k, TA posts £38k, rates £5k and trust pool £41k. These proposals are not yet deducted from the base forecast.</p><p>The Brookside £11k comparison is part of the wider staffing opportunity; it is not counted twice.</p>${btn('Show working','data-detail="savings"','small')}${btn('Model actions','data-go="forecast"','small')}`;if(/peer|pupil|source period/.test(t))return `<h3>Compare within school phase</h3><p>The trust forecast is £603 per pupil. Special-school support needs make a single trust average hard to interpret; use phase-matched cohorts and aligned financial periods.</p><p>Peer values in this study are fictional, with no external dataset connected.</p>${btn('Cohort and sources','data-detail="benchmark-source"','small')}`;if(/changed|forecast|range/.test(t))return `<h3>The forecast rose £36k this month</h3><p>September’s £4.111m estimate is now £4.147m. The example range is £4.10m–£4.20m. Remaining demand and rate assumptions can be modelled without changing already-worked spend.</p>${btn('Test a scenario','data-go="forecast"','small')}`;if(/structural|demand/.test(t))return `<h3>£2.13m is structural demand</h3><p>Vacancies (£1.12m) and SEND support (£1.01m) account for 51% of forecast spend, up from 43% last year. Recruitment, funding and staffing plans need a different response from short-term absence.</p>${btn('Review workforce','data-go="workforce"','small')}`;if(/permission|school user|policy/.test(t))return `<h3>Keep answers within the user’s scope</h3><p>School requesters see operational records; school leaders can see their school’s approved reports. MAT leaders see the full portfolio. Commercial recommendations require an agreed release policy.</p>${btn('Review access and policy','data-go="settings"','small')}`;return `<h3>Try a prepared example</h3><p>This mockup demonstrates the Copilot experience with scripted answers. Try asking about Willow, the savings working, supplier reliability or the board finance note.</p>`;}
function renderAssistant(){const a=$('#assistant');a.hidden=!state.copilotOpen;document.body.classList.toggle('has-assistant',state.copilotOpen);if(!state.copilotOpen)return;const title=state.school!==null&&state.route==='schools'?schoolData[state.school].name:(navs.find(x=>x[0]===state.route)?.[2]||'Settings');a.innerHTML=`<header><h2>${icon('spark')}Spend Copilot</h2>${btn(icon('close'),'data-close-copilot aria-label="Close Copilot"')}</header><div class="context">${title} · prepared example answers</div><div class="conversation">${state.conversation.length?state.conversation.map(x=>`<div class="bubble ${x.user?'user':''}">${x.user?esc(x.text):x.text}</div>`).join(''):`<div class="bubble"><h3>What would you like to understand?</h3><p>Explore the figures, review the working and draft a next step.</p></div><div class="prompt-list">${(prompts[state.route]||prompts.overview).map(q=>btn(q,`data-prompt="${q}"`)).join('')}</div>`}</div><form class="composer" data-ask><input name="question" aria-label="Copilot question" placeholder="Ask about spend or cover…" required>${btn(icon('send'),'type="submit" aria-label="Ask Copilot"','primary')}</form>`;const list=a.querySelector('.conversation');list.scrollTop=list.scrollHeight;}

document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;if('closeDialog'in d){$('#detail').close();return;}if('closeCopilot'in d){state.copilotOpen=false;renderAssistant();$('.copilot-button').focus();return;}if('copilot'in d){state.copilotOpen=!state.copilotOpen;renderAssistant();if(state.copilotOpen)$('#assistant input').focus();return;}if(d.go){navigate(d.go);return;}if('school'in d){state.school=Number(d.school);if($('#detail').open)$('#detail').close();if(state.route==='schools'){renderMain();window.scrollTo(0,0);renderAssistant();}else if(window.MAT_CONNECTED){state.route='schools';render();}else location.hash='schools';return;}if('backSchools'in d){state.school=null;renderMain();return;}if('schoolQuestion'in d){ask('Summarise '+schoolData[+d.schoolQuestion].name+' against budget and cover demand');return;}if(d.breakdown){state.breakdown=d.breakdown;renderMain();return;}if(d.ops){state.ops=d.ops;renderMain();renderAssistant();return;}if(d.reportTab){state.reportTab=d.reportTab;if(state.route==='reports')renderMain();else navigate('reports');return;}if(d.report){if(['schools','forecast','workforce','benchmarks','service'].includes(d.report))navigate(d.report);else if(d.report==='reasons'){state.breakdown='Reason';navigate('forecast');}else openDetail(d.report);return;}if(d.prompt){ask(d.prompt);return;}if(d.detail){openDetail(d.detail);return;}if('board'in d){showBoard();return;}if('boardActions'in d){state.boardActions=true;showBoard();return;}if('printBoard'in d){window.print();return;}if('resetScenario'in d){state.scenarioDemand=state.scenarioRate=0;state.scenarioSavings=false;renderMain();return;}if('saveScenario'in d){modal('Scenario saved · design preview',`<p><strong>${'£'+(scenarioValue()/1000).toFixed(3)+'m'} year-end</strong></p><p>Remaining demand ${state.scenarioDemand}%; daily charge ${state.scenarioRate}%; proposed savings ${state.scenarioSavings?'included':'excluded'}.</p><p>The approved budget and base forecast remain unchanged.</p>`);return;}if('importPreview'in d){const history=$('#import-type').value==='Prior-year spend';modal(history?'Review prior-year spend mapping':'Review budget mapping',table(history?['School','Prior-year spend','Source year']:['School','Annual budget','Monthly basis'],schoolData.map(s=>history?[s.name,k(s.prior),'2025/26']:[s.name,k(s.budget),'Annual ÷ 12']))+`<p style="margin-top:16px">12 schools matched · ${history?'£3.700m prior-year actual spend':'£4.040m approved budget'} · no duplicate IDs. Prepared ${history?'history':'budget'} sample rows; no file is uploaded.</p>`,btn('Confirm sample mapping','data-save-preview','primary'));return;}if('savePreview'in d){$('#detail').close();toast('Preview complete. Settings and records have not been saved.');return;}if(d.draft){modal('Draft for review',`<p>Prepared example — review before sending.</p><textarea rows="8" aria-label="Draft next action">${d.draft==='overcharge'?'Please review 37 Northstar invoice days against the effective £128 rate card. The example billed rate is £260, a potential £4,884 difference. Confirm exceptions and credits before requesting recovery.':d.draft==='longterm'?'Please compare a named long-term English educator at Brookside against the remaining daily cover requirement. Confirm the £220/day option, availability and cancellation terms before proceeding.':'Please arrange a review of the highlighted staffing or supplier issue, using the source agreement and records to confirm the next step.'}</textarea>`,btn('Keep draft','data-save-preview','primary'));return;}if('csv'in d){const rows=[['School','Forecast_GBP','Budget_GBP','Variance_GBP'],...schoolData.map(s=>[s.name,s.forecast*1000,s.budget*1000,(s.forecast-s.budget)*1000])];const blob=new Blob([rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(MAT_BRANDS[document.documentElement.dataset.theme]?.productName||'SP+')+'_fictional_school_report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(b.id==='messages'||'openMessages'in d){openChat();return;}if('closeChat'in d){$('#chat').hidden=true;return;}});

const baseOverview=overview, baseForecast=forecast, baseSchools=schools, baseService=service, baseReports=reports, baseOperations=operations, baseAnswer=answer;

bars=function(rows,max,unit='%',compare=false){return `<div class="horizontal-bars" style="--bar-count:${rows.length}">${rows.map(([n,v,p],i)=>`<div class="hbar"><span>${esc(n)}</span><span class="track"><i class="fill" style="width:${v/max*100}%;background:${colours[i%5]}"></i>${compare?`<i class="tick" style="left:${p/max*100}%"></i>`:''}</span><b>${unit==='£'?money(v):unit==='k'?k(v):v+unit}</b></div>`).join('')}</div>`;};
reasonWorking=function(){return `<div class="reason-list">${breakdowns.Reason.map(([n,v,p,c])=>`<div class="reason-row"><div><strong>${n}</strong><span class="reason-kind">${c}</span></div><div class="reason-values"><b>${k(v)}</b><span class="${v>p?'negative':'positive'}">${variance(v-p)} vs last year</span></div><span class="reason-response">${reasonResponses[n]}</span></div>`).join('')}</div>`;};
schoolBars=function(){return `<div class="school-bars">${[2,0,3,1].map(i=>{const s=schoolData[i];return `<div class="school-bar"><button class="name" data-school="${i}">${s.name.replace(/ Academy| Learning Centre/g,'')}</button><span class="var ${s.forecast>s.budget?'negative':'positive'}">${variance(s.forecast-s.budget)}</span><div class="school-track"><div class="bullet" style="width:${s.forecast/750*100}%"><i class="worked" style="width:${s.spent/s.forecast*100}%"></i>${s.forecast>s.budget?`<i class="over" style="width:${(s.forecast-s.budget)/s.forecast*100}%"></i>`:''}<i class="budget" style="left:${s.budget/s.forecast*100}%"></i></div></div></div>`;}).join('')}${legend([['Spent','var(--chart-1)'],['Remaining','var(--chart-remaining)'],['Over budget','var(--negative-fill)'],['Budget','var(--text)','tick']])}</div>`;};

function drawSizedPlot(kind,data,w,h){
 const text=(x,y,s,anchor='start',extra='')=>`<text x="${x}" y="${y}" text-anchor="${anchor}" ${extra}>${esc(String(s))}</text>`;
 const line=(x1,y1,x2,y2,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${extra}/>`;
 const rect=(x,y,width,height,fill,extra='')=>`<rect x="${x}" y="${y}" width="${Math.max(0,width)}" height="${Math.max(0,height)}" fill="${fill}" ${extra}/>`;
 let content='',dark=data.dark;
 if(kind==='monthly'){
  const left=48,right=w-8,top=25,base=h-30,step=(right-left)/12,scale=(base-top)/500,bw=Math.min(22,step*.34),y=v=>base-v*scale;
  content+=rect(left+step*2,top-10,right-left-step*2,base-top+10,dark?'var(--overlay-light)':'var(--surface-subtle)');
  [0,200,400].forEach(v=>{content+=line(left,y(v),right,y(v),'class="plot-grid"')+text(left-7,y(v)+4,v?'£'+v+'k':'£0','end');});
  monthly.forEach((v,i)=>{let x=left+step*(i+.5);content+=`<g><title>${['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'][i]}: ${k(v)} ${i<2?'actual':'forecast'}; last year ${k(lastYear[i])}</title>`+rect(x-bw-1,y(lastYear[i]),bw,lastYear[i]*scale,dark?'var(--chart-prior-dark)':'var(--chart-prior)','rx="2"')+rect(x+1,y(v),bw,v*scale,i<2?'var(--accent)':'var(--chart-forecast)','rx="2"')+'</g>'+(w<400&&i%2?'':text(x,base+23,['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'][i],'middle'));});
  content+=line(left,y(4040/12),right,y(4040/12),'class="plot-target"')+text(left+step*2+6,top+4,'Forecast →');
 }
 if(kind==='risk'){
  const left=45,right=w-10,top=30,bottom=h-55,x=v=>left+(v+80)/240*(right-left),y=v=>bottom-v/100*(bottom-top),mid=x(0),half=y(50);
  content+=rect(left,top,mid-left,half-top,'var(--warning-surface)')+rect(mid,top,right-mid,half-top,'var(--negative-surface)')+rect(left,half,mid-left,bottom-half,'var(--positive-surface)')+rect(mid,half,right-mid,bottom-half,'var(--surface-subtle)');
  content+=line(mid,top,mid,bottom,'class="plot-target"')+line(left,half,right,half,'class="plot-target"');
  content+=text(left+8,top+17,'Support people')+text(right-8,top+17,'Intervene','end')+text(left+8,bottom-9,'Stable')+text(right-8,bottom-9,'Review spend','end');
  schoolData.forEach(s=>{const cx=x(s.forecast-s.budget),cy=y(s.risk);content+=`<g><title>${s.name}: ${variance(s.forecast-s.budget)}, cover risk ${s.risk}/100</title><circle cx="${cx}" cy="${cy}" r="${5+Math.sqrt(s.pupils)/5}" fill="${s.risk>60?(s.forecast>s.budget?'var(--negative-fill)':'var(--warning-fill)'):'var(--chart-risk-low)'}" stroke="var(--surface)" stroke-width="2"/>${s.risk>60?text(Math.min(cx,right-5),cy+25,s.name.split(' ')[0],cx>right-40?'end':'middle'):''}</g>`;});
  content+=text(left,bottom+21,'−£80k')+text(mid,bottom+21,'On budget','middle')+text(right,bottom+21,'+£160k','end')+text((left+right)/2,h-7,'Forecast variance against budget','middle')+text(0,0,'Cover risk','middle',`transform="translate(15 ${(top+bottom)/2}) rotate(-90)"`);
 }
 if(kind==='waterfall'){
  const left=8,right=w-8,top=32,base=h-62,scale=(base-top)/120,step=(right-left)/6,bw=Math.min(58,step*.6),y=v=>base-v*scale,values=[107,77,39,34,-7,-7],starts=[0,107,77,39,34,0];
  content+=line(left,base,right,base,'class="plot-grid"');
  values.forEach((v,i)=>{const a=starts[i],x=left+step*(i+.5)-bw/2,hi=Math.max(a,v),lo=Math.min(a,v);content+=rect(x,y(hi),bw,(hi-lo)*scale,i===0?'var(--negative-fill)':i===5?'var(--positive-text)':'var(--chart-1)','rx="2"')+text(x+bw/2,y(hi)-10,['+£107k','−£30k','−£38k','−£5k','−£41k','−£7k'][i],'middle')+text(x+bw/2,h-10,['Gap','Recruit','TA posts','Rates','Pool','After'][i],'middle');if(i<5)content+=line(x+bw,y(v),left+step*(i+1.5)-bw/2,y(v),'class="plot-target"');});
 }
 if(kind==='columns'){
  const rows=data.rows,max=data.max,left=52,right=w-8,top=30,base=h-48,step=(right-left)/rows.length,bw=Math.min(84,step*.55),y=v=>base-v/max*(base-top);
  [0,.5,1].forEach(f=>{const v=max*f;content+=line(left,y(v),right,y(v),'class="plot-grid"')+text(left-8,y(v)+4,k(v),'end');});
  rows.forEach(([label,v],i)=>{const x=left+step*(i+.5);content+=rect(x-bw/2,y(v),bw,base-y(v),data.sameColor?'var(--chart-1)':colours[i],'rx="3"')+text(x,y(v)-10,k(v),'middle','class="plot-value"');const labels=label.includes('Support')?[label.replace(' Support',''),'Support']:[label];labels.forEach((l,j)=>{content+=text(x,base+22+j*17,l,'middle');});});
 }
 if(kind==='service'){
  const left=43,right=w-12,top=24,base=h-32,y=v=>base-(v-80)/20*(base-top),x=i=>left+12+i*(right-left-24)/5,values=[91,93,94,95,96,96];
  [80,90,100].forEach(v=>{content+=line(left,y(v),right,y(v),'class="plot-grid"')+text(left-7,y(v)+4,v+'%','end');});
  content+=line(left,y(95),right,y(95),'class="plot-target"')+text(right,y(95)-8,'95% target','end')+`<polyline points="${values.map((v,i)=>`${x(i)},${y(v)}`).join(' ')}" fill="none" stroke="var(--chart-line)" stroke-width="3"/>`;
  values.forEach((v,i)=>{content+=`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="var(--chart-line)"><title>Week ${i+1}: ${v}%</title></circle>`+text(x(i),base+23,'W'+(i+1),'middle');});
 }
 return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" class="sized-plot ${dark?'plot-dark':''}">${content}</svg>`;
}

const chartLayoutRender=renderMain;
let plotResizeObserver;
function observeSizedPlots(){
 const draw=el=>{const box=el.getBoundingClientRect();if(box.width>0&&box.height>0)el.innerHTML=drawSizedPlot(el.dataset.sizingPlot,JSON.parse(el.dataset.plot),Math.round(box.width),Math.round(box.height));};
 plotResizeObserver??=new ResizeObserver(entries=>entries.forEach(({target})=>draw(target)));
 document.querySelectorAll('[data-sizing-plot]').forEach(el=>{draw(el);plotResizeObserver.observe(el);});
}
const chartLayoutModal=modal;
modal=function(...args){chartLayoutModal(...args);observeSizedPlots();};
renderMain=function(){
 plotResizeObserver?.disconnect();chartLayoutRender();
 const root=$('#main');root.dataset.chartLayout=state.route;
 const panels=[...root.querySelectorAll('.panel')];
 const titled=t=>panels.find(p=>p.querySelector('h2')?.textContent===t);
 const replaceBody=(title,html)=>{const p=titled(title);if(p){p.querySelector('.panel-body').innerHTML=html;p.classList.add('fitted-chart-panel');}};
 if(state.route==='workforce'){
  const rows=['Teaching','Academic Support','Non-Academic Support'].filter(c=>state.workCategory==='All categories'||state.workCategory===c).map(c=>[c,workforceRoles.filter(r=>r[0]===c).reduce((s,r)=>s+r[4],0)]);
  const largest=Math.max(...rows.map(r=>r[1])),step=largest>1000?500:50,max=Math.ceil(largest/step)*step;
  replaceBody('Spend by category',plotHost('columns',{rows,max},'Forecast spend by workforce category in thousands of pounds'));
 }
 if(state.route==='forecast')replaceBody('SEND: a persistent increase',plotHost('columns',{rows:[['2024/25',640],['2025/26',771],['2026/27',1010]],max:1200,sameColor:true},'SEND spend: £640k, £771k and £1,010k over three years')+'<p class="chart-caption"><strong>+58% in two years.</strong> Review funded support, staffing plans and long-term cover together.</p>');
 if(state.route==='service')replaceBody('Service trend',plotHost('service',{},'Weekly fill rate: 91%, 93%, 94%, 95%, 96%, 96%. Target 95%.')+'<p class="chart-caption">Weekly fill trend; term total is weighted by requests.</p>');
 for(const p of panels){if(p.querySelector('.plot-frame,.horizontal-bars,.mix-chart,.school-bars'))p.classList.add('fitted-chart-panel');}
 if(state.route==='overview')titled('What changed — and what to do')?.classList.add('reason-panel');
 // Recompute plot geometry when the card changes width, including Copilot open/close.
 observeSizedPlots();
};

render();</script></body></html>
